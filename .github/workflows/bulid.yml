name: Build ArchDroid Terminal

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Extract project zip"
        run: |
          test -f ArchDroidTerminal.zip
          unzip -q ArchDroidTerminal.zip -d .
          ls ArchDroidTerminal

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Set up Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Fetch proot and its libraries"
        working-directory: ArchDroidTerminal
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://packages.termux.dev/apt/termux-main
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT" _work
          cd _work
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          field() {
            awk -v pkg="$1" -v f="$2" 'BEGIN{RS="";FS="\n"} $1=="Package: " pkg {for(i=1;i<=NF;i++) if (index($i,f": ")==1){print substr($i,length(f)+3); exit}}' Packages
          }
          fetch() {
            file=$(field "$1" Filename)
            sha=$(field "$1" SHA256)
            [ -n "$file" ] || { echo "::error::package $1 not found in Termux index"; exit 1; }
            curl -fsSL "$BASE/$file" -o "$1.deb"
            echo "$sha  $1.deb" | sha256sum -c -
            mkdir -p "x-$1"
            dpkg-deb -x "$1.deb" "x-$1"
            echo "$1 depends on: $(field "$1" Depends)"
          }
          biggest() {
            find "$1" -type f -name "$2" -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-
          }
          fetch proot
          fetch libtalloc
          fetch libandroid-shmem
          P=$(find x-proot -type f -name proot -path '*bin*' | head -n1)
          L=$(find x-proot -type f -name loader -path '*proot*' | head -n1)
          T=$(biggest x-libtalloc 'libtalloc.so*')
          S=$(biggest x-libandroid-shmem 'libandroid-shmem.so*')
          [ -n "$P" ] && [ -n "$L" ] && [ -n "$T" ] && [ -n "$S" ] || { echo "::error::could not locate all files"; exit 1; }
          cp "$P" "$OUT/libproot.so"
          cp "$L" "$OUT/libproot-loader.so"
          cp "$T" "$OUT/libtalloc.so"
          cp "$S" "$OUT/libandroid-shmem.so"
          ls -l "$OUT"
          echo "--- checking required libraries ---"
          for f in libproot.so libandroid-shmem.so; do
            readelf -d "$OUT/$f" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'
          done | sort -u | while read -r n; do
            echo "needs: $n"
            case "$n" in
              libc.so|libm.so|libdl.so|liblog.so|libz.so|libandroid.so|libstdc++.so|libtalloc.so.2) continue ;;
            esac
            [ -f "$OUT/$n" ] || { echo "::error::proot needs $n which is not bundled"; exit 1; }
          done

      - name: "Build debug APK"
        working-directory: ArchDroidTerminal
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: "Show compile errors"
        if: failure()
        working-directory: ArchDroidTerminal
        shell: bash
        run: |
          grep -E "^e: |^w: |error:" build.log | head -80

      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ArchDroidTerminal-apks
          path: ArchDroidTerminal/app/build/outputs/apk/debug/*.apk
