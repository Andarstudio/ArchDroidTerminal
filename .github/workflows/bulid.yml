name: Build ArchDroid Terminal

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIP_NAME: ArchDroidTerminal.zip
    steps:
      - name: Check out repository (contains the zip)
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          test -f "$ZIP_NAME" || { echo "::error::$ZIP_NAME not found in repo root"; exit 1; }
          unzip -q "$ZIP_NAME" -d .
          ls ArchDroidTerminal

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

